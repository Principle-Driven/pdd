name: Publish CLI

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'cli-v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Get the release source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an npm version that supports trusted publishing
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Check and build the repository
        run: npm run build

      - name: Match the package version to the release tag
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/cli/package.json').version")"
          test "cli-v${package_version}" = "${{ github.event.release.tag_name }}"

      - name: Publish the public CLI package
        run: npm publish --workspace @principle-driven/cli --access public
